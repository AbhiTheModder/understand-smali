name: Update grammar

on:
  repository_dispatch:
    types:
      - grammar-updated

jobs:
  update-grammar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main repository
        uses: actions/checkout@v4

      - name: Checkout smalig repository
        uses: actions/checkout@v4
        with:
          repository: RevEngiSquad/smalig
          path: smalig

      - name: Update YAML and convert to JSON
        run: |
          mv ./smalig/smalig/grammar.yaml ./data/grammar.yaml
          rm -r smalig
          pip install pyyaml
          python3 -c "import yaml, json; d=yaml.safe_load(open('data/grammar.yaml')); json.dump(d, open('data/grammar.json','w'), indent=2)"

      - name: Commit changes
        run: |
          git add ./data/grammar.yaml ./data/grammar.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          echo "file_updated=true" >> $GITHUB_ENV

      - name: Create Pull Request
        if: success() && env.file_updated == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update grammar data (YAML + JSON)"
          branch: update-grammar-file
          title: "Update grammar data"
          body: "This PR updates the grammar.yaml and grammar.json files with the latest changes from the smalig repository."